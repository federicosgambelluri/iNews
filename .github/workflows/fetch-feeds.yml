name: Aggiorna la cache delle notizie

on:
  schedule:
    - cron: '17 * * * *'   # ogni ora, al minuto 17
  workflow_dispatch:        # e a mano, dal tab Actions
  push:
    branches: [main]
    paths: ['assets/js/config.js', 'tools/fetch-feeds.mjs']

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scarica i feed
        run: node tools/fetch-feeds.mjs

      - name: Fai commit se qualcosa è cambiato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: aggiorna cache notizie [skip ci]"
          git push
